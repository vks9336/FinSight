spark.master                                  spark://spark-master:7077

# Warehouse and metastore. Spark 4.0 supports metastore clients up to 4.0.0, but
# only through an isolated classloader -- its builtin Hive is 2.3.10, which
# cannot complete the 4.x thrift handshake. The 4.0.0 client jars are copied out
# of apache/hive:4.0.0 into /opt/hive-jars by the Dockerfile, so no Maven fetch
# happens at job start.
spark.sql.catalogImplementation               hive
spark.hadoop.hive.metastore.uris              thrift://hive-metastore:9083
spark.sql.hive.metastore.version              4.0.0
spark.sql.hive.metastore.jars                 path
spark.sql.hive.metastore.jars.path            file:///opt/hive-jars/*

# Must match hive.metastore.warehouse.dir in hive-site.xml, or Spark-created
# tables land somewhere Hive will not look for them.
spark.sql.warehouse.dir                       hdfs://namenode:8020/user/hive/warehouse

spark.hadoop.fs.defaultFS                     hdfs://namenode:8020

# 16 rather than the default 200: the demo slice is small enough that 200
# shuffle partitions would produce mostly empty tasks and dominate the runtime.
spark.sql.shuffle.partitions                  16
spark.sql.adaptive.enabled                    true
spark.sql.adaptive.coalescePartitions.enabled true

spark.sql.session.timeZone                    UTC
spark.serializer                              org.apache.spark.serializer.KryoSerializer

spark.eventLog.enabled                        false
spark.ui.showConsoleProgress                  true

# Streaming jobs run indefinitely; without this a transient Kafka hiccup on one
# task can tear down the whole application.
spark.task.maxFailures                        8
